<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f9fb" />
    <meta
      name="description"
      content="Tu referencia personal para comprar CSPX en IBKR y entender inversiones internacionales y locales."
    />
    <title>Notas de inversión</title>
    <script>
      try {
        const t = localStorage.getItem("invest-notes-theme");
        document.documentElement.classList.toggle(
          "dark",
          t === "dark" ||
            (t !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches),
        );
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
